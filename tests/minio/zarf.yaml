apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: minio-test
  description: "A test that minio can be connected to and is functional"
  version: 0.1.0

values:
  files:
    - zarf-values.yaml

components:
  # Reconcile the UDS Package before creating pods. In sidecar mode the namespace
  # must be labeled for injection before the Jobs are admitted.
  - name: configure-mc-cli-network
    manifests:
      - name: mc-cli-package
        namespace: mc-cli
        enableTemplating: true
        files:
          - uds-package.yaml
    actions:
      onDeploy:
        onSuccess:
          - description: Wait for the mc-cli UDS Package
            maxTotalSeconds: 300
            wait:
              cluster:
                kind: Packages
                name: mc-cli
                namespace: mc-cli
                condition: "'{.status.phase}'=Ready"

  - name: test-minio-connectivity
    manifests:
      - name: mc-cli-jobs
        namespace: mc-cli
        files:
          - mc-cli-test.yaml
          - mc-cli-policy.yaml
    images:
      - name: ghcr.io/uds-packages/minio-operator/container/chainguard/minio-client:0.20250813.083541-r29
